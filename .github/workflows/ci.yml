name: ThreatMind AI Continuous Integration & Verification

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  backend-verification:
    name: Backend Test Suite & Release Gates
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.20.0
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Seed Demo Data into Neo4j
        env:
          PYTHONPATH: backend:.
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: password
          NEO4J_DATABASE: neo4j
        run: |
          python scripts/seed_demo_data.py

      - name: Run Full Backend Pytest Suite
        env:
          PYTHONPATH: backend:.
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: password
          NEO4J_DATABASE: neo4j
          JWT_SECRET_KEY: test-ci-secret-key-threatmind-must-be-min-32-bytes
        run: |
          pytest backend/tests/ -v --tb=short --junitxml=pytest-results.xml || (echo "=== PYTEST FAILED ===" && pytest backend/tests/ --lf -v --tb=long && exit 1)

      - name: Upload Pytest Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml

      - name: Run Phase 11 Release Verification Gates
        env:
          PYTHONPATH: backend:.
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: password
          NEO4J_DATABASE: neo4j
        run: |
          python scripts/verify_phase11_release.py

  frontend-verification:
    name: Frontend Test Suite & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Vitest Suite
        working-directory: frontend
        run: npm test -- --run

      - name: Build Production Frontend
        working-directory: frontend
        run: npm run build
