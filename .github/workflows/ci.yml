name: ThreatMind AI Continuous Integration & Verification

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  backend-verification:
    name: Backend Test Suite & Release Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Full Backend Pytest Suite
        env:
          PYTHONPATH: backend
        run: |
          pytest backend/tests/ -v

      - name: Run Phase 11 Release Verification Gates
        env:
          PYTHONPATH: backend
        run: |
          python scripts/verify_phase11_release.py

  frontend-verification:
    name: Frontend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Vitest Suite
        working-directory: frontend
        run: npm test -- --run
